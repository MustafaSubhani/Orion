[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-harness"
version = "5.0.0"
description = "A local, plugin-based harness platform for enterprise data: typed self-healing agents, MCP, guardrails, memory, and a Lab for new agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "filelock>=3.13",
  "pandas>=2.1",
  "numpy>=1.26",
  "pyarrow>=15",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
# HTTP API and control plane
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "python-docx>=1.1"]
# Hugging Face prompt-injection guardrail (admin-toggleable)
guard = ["transformers>=4.40", "torch>=2.2"]
# MCP server and client
mcp = ["mcp>=1.2"]
# DuckDuckGo web search backend. OpenAI hosted search needs only OPENAI_API_KEY (no extra package).
search = ["ddgs>=9"]
# Retrieval over documents (Chroma + sentence-transformers)
rag = ["chromadb>=0.5", "sentence-transformers>=3"]
# OS resource limits for generated code on Windows
sandbox = ["pywin32>=306; sys_platform == 'win32'"]
# Optional Gradio fallback UI
gradio = ["gradio>=4"]
# OpenID Connect sign-in (ID-token verification against the provider's JWKS)
oidc = ["pyjwt[crypto]>=2.8"]
dev = ["ruff>=0.5", "pyright>=1.1.370"]
all = [
  "orion-harness[api,guard,mcp,search,rag,sandbox,oidc]",
]

[project.scripts]
orion = "harness.cli:main"

[project.entry-points."orion.packs"]
enterprise_lake = "packs.enterprise_lake:PACK"

[tool.setuptools.packages.find]
include = ["harness*", "backend*", "workers*", "sandbox*", "repair*", "lab*", "kb*", "retrieval*", "packs*"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["bench", "paper", "frontend", "web", "data", "outputs", "loaders", "agents", "chroma_db"]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]  # E includes E722 (bare except)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E741", "B011", "B017"]
"harness/tool_registry.py" = ["E501"]
"packs/enterprise_lake/*" = ["E501"]
"lab/synthesizer.py" = ["E501"]
"kb/ingest.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Header", "fastapi.Form"]

[tool.pyright]
include = ["harness", "sandbox", "backend", "lab", "packs"]
exclude = ["**/__pycache__", "lab/generated"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = "none"
reportMissingModuleSource = "none"
reportAttributeAccessIssue = "none"
reportArgumentType = "none"
reportCallIssue = "none"
reportOptionalMemberAccess = "none"
reportIndexIssue = "none"
reportOperatorIssue = "none"
reportReturnType = "none"
